name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    # Сохраняем Java 8 как базовую
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    # Подготавливаем Java 17 для временного переключения
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up NodeJS
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install Cordova
      run: npm install -g cordova@10.0.0

    # Шаг А: Добавляем платформу под Java 17 (чтобы проскочить ошибку Gradle 9.5.1)
    # Переменная меняется локально внутри этого блока run
    - name: Add Android Platform
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        cordova platform add android@9.1.0

    # Шаг Б: Собираем проект. Здесь JAVA_HOME автоматически возвращается к Java 8.
    # Cordova видит родную Java 8, проходит проверку требований и запускает локальный gradlew
    - name: Build APK
      run: |
        cordova build android --debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: platforms/android/app/build/outputs/apk/debug/app-debug.apk