name: Build BatteryGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install Cordova and Tools
      run: |
        npm install -g cordova@10.0.0

    - name: Create Cordova Project and Build
      run: |
        # Создаем временную директорию для сборки, чтобы не затереть корень
        cordova create build_dir com.custom.batteryguard BatteryGuard
        
        # Копируем наши настроенные файлы интерфейса в проект
        rm -rf build_dir/www
        cp -r www build_dir/
        
        # Копируем правильный config.xml
        cp config.xml build_dir/config.xml
        
        cd build_dir
        
        # Добавляем наш кастомный локальный плагин
        cordova plugin add ../local-plugins/cordova-plugin-battery-guard --local
        
        # Добавляем платформу Android
        cordova platform add android@9.1.0
        
        # Запускаем компиляцию APK
        cordova build android --debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v3
      with:
        name: BatteryGuard-APK
        path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk