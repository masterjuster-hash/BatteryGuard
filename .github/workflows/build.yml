name: Build BatteryGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 8 (Strictly for Cordova 9)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'

    - name: Install Compatible Gradle 7.1.1
      run: |
        wget -q https://services.gradle.org/distributions/gradle-7.1.1-bin.zip
        sudo unzip -q gradle-7.1.1-bin.zip -d /opt
        echo "/opt/gradle-7.1.1/bin" >> $GITHUB_PATH

    - name: Install Cordova and Tools
      run: |
        npm install -g cordova@10.0.0

    - name: Create Cordova Project and Build
      run: |
        gradle -v
        
        # 1. Создаем базовую структуру проекта
        cordova create build_dir com.custom.batteryguard BatteryGuard
        rm -rf build_dir/www
        cp -r www build_dir/
        cp config.xml build_dir/config.xml
        
        # 2. Переходим в проект и ставим плагин с платформой
        cd build_dir
        cordova plugin add ../local-plugins/cordova-plugin-battery-guard --local
        cordova platform add android@9.1.0
        
        # 3. Гарантированное ожидание стабилизации папки на диске (до 15 секунд)
        echo "Waiting for Android platform folder to stabilize..."
        sleep 15
        
        # Жесткая проверка: пока папка физически не появится, скрипт дальше не пойдет
        until [ -d "platforms/android" ]; do
          echo "Platform folder not ready yet, waiting another 2 seconds..."
          sleep 2
        done
        
        # 4. Заменяем репозитории
        find platforms/android/ -name "*.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
        
        # 5. Запускаем компиляцию
        cordova build android --debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: BatteryGuard-APK
        path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk