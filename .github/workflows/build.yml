name: Build BatteryGuard APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 8 (Strictly for Cordova 9)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '16'

    - name: Install Cordova and Tools
      run: |
        npm install -g cordova@10.0.0

    - name: Create Cordova Project and Build
      run: |
        cordova create build_dir com.custom.batteryguard BatteryGuard
        rm -rf build_dir/www
        cp -r www build_dir/
        cp config.xml build_dir/config.xml
        cd build_dir
        cordova plugin add ../local-plugins/cordova-plugin-battery-guard --local
        cordova platform add android@9.1.0
        cordova build android --debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: BatteryGuard-APK
        path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk