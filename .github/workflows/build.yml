name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Set up NodeJS
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install Cordova
      run: npm install -g cordova@10.0.0

    - name: Install Project Dependencies
      run: npm install

    - name: Build Android Platform
      run: cordova platform add android@9.1.0

    - name: Build APK
      run: cordova build android --debug

    # Глобальный поиск APK по всему рабочему пространству
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: |
          **/*.apk
          !node_modules/**/*.apk