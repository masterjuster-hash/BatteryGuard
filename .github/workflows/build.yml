name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Set up NodeJS
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install Cordova
      run: npm install -g cordova@10.0.0

    # Твоя родная структура сборки, которую я зря сломал
    - name: Build Project Structure
      run: |
        cordova create build_dir com.custom.batteryguard BatteryGuard
        rm -rf build_dir/www
        cp -r www build_dir/
        cp config.xml build_dir/config.xml
        cd build_dir
        cordova platform add android@9.1.0
        cordova build android --debug

    # Рабочий загрузчик v4, который заберет файл из папки build_dir
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build_dir/platforms/android/app/build/outputs/apk/debug/app-debug.apk